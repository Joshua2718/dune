<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gravity Platformer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101820;
    font-family: Arial, sans-serif;
}

canvas {
    touch-action: none;
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resize);

resize();


/* =========================================================
   TERRAIN FUNCTIONS
   ========================================================= */

function terrainStart(u) {

    const x = u;

    if (x < 0.5 * Math.PI) {
        return 0.8
    }

    return 0.4 * (
        Math.cos(
            (x - 0.5 * Math.PI) / 1.5
        ) + 1
    );
}

function terrainF(u) {

    const x =
        u - 1.1 * Math.PI;

    return 0.8 * (
        Math.cos(
            x / 1.1
        ) + 1
    );
}

function terrainG(u) {

    const x =
        u - 1.4 * Math.PI;

    return 1.2 - Math.abs(
        Math.cos(
            x / 1.4
        ) - 0.2
    );
}

function terrainH(u) {

    const x =
        u - 0.75 * Math.PI;

    if (x < 0) {

        return 0.6 * (
            Math.cos(
                x / 0.75
            ) + 1
        );
    }

    return 0.6 * (
        Math.cos(
            x / 0.75 / 2
        ) + 1
    );
}


/* =========================================================
   TERRAIN TYPES
   ========================================================= */

const TERRAIN_TYPES = [

    {
        name: "start",
        width: 2 * Math.PI,
        height: terrainStart
    },

    {
        name: "f",
        width: 2.2 * Math.PI,
        height: terrainF
    },

    {
        name: "g",
        width: 2.8 * Math.PI,
        height: terrainG
    },

    {
        name: "h",
        width: 2.25 * Math.PI,
        height: terrainH
    }

];


/* =========================================================
   RANDOM TERRAIN BLOCKS
   ========================================================= */

let terrainBlocks = [];

function generateNextTerrainBlock() {

    const typeIndex =
        1 +
        Math.floor(
            Math.random()
            * (
                TERRAIN_TYPES.length - 1
            )
        );


    const type =
        TERRAIN_TYPES[typeIndex];

    const scale =
        1.0 + Math.random() * 0.4;

    const start =
        terrainBlocks.length === 0
            ? 0
            : terrainBlocks[
                terrainBlocks.length - 1
            ].end;

    terrainBlocks.push({
        type: typeIndex,
        name: type.name,
        scale: scale,
        start: start,
        end: start + type.width * scale
    });
}

function ensureTerrainTo(x) {

    if (x <= 0) {
        return;
    }

    while (
        terrainBlocks.length === 0
        ||
        terrainBlocks[
            terrainBlocks.length - 1
        ].end < x
    ) {
        generateNextTerrainBlock();
    }
}

function findTerrainBlock(x) {

    if (x < 0) {
        return null;
    }

    ensureTerrainTo(x);

    let left = 0;
    let right = terrainBlocks.length - 1;

    while (left <= right) {

        const mid =
            Math.floor(
                (left + right) / 2
            );

        const block =
            terrainBlocks[mid];

        if (x < block.start) {
            right = mid - 1;
        } else if (x > block.end) {
            left = mid + 1;
        } else {
            return block;
        }
    }

    return null;
}


/* =========================================================
   TERRAIN HEIGHT
   ========================================================= */

function terrainHeight(x) {

    if (x < 0) {
        return 0.8;
    }

    const block =
        findTerrainBlock(x);

    if (!block) {
        return 0;
    }

    const type =
        TERRAIN_TYPES[
            block.type
        ];

    const scale =
        block.scale || 1.0;

    const localX =
        (x - block.start) / scale;

    return type.height(localX) * scale;
}


/* =========================================================
   TERRAIN SLOPE
   ========================================================= */

function terrainSlope(x) {

    if (x < 0) {
        return 0;
    }

    const dx = 0.0001;

    return (
        terrainHeight(
            x + dx
        )
        -
        terrainHeight(
            x - dx
        )
    )
    /
    (2 * dx);
}


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x: 0,

    y: 0,

    vx: 0,

    vy: 0,

    radius: 0.16,

    grounded: true,

    jumpBaseY: 0,

    jumpBaseX: 0,

    maxJumpHeight: 0,

    jumpActive: false,

    /* 튕겨 나간 직후 연속 충돌로 인한 사망 방지 유예 시간 (초) */
    impactGraceTime: 0
};

let landingGuideY = 0;


/* =========================================================
   PHYSICS CONSTANTS
   ========================================================= */

const GRAVITY = 8.0;

const RIGHT_ACCELERATION = 10.0;

const COMBO_ACCELERATION_BONUS = 1.0;

const DOWN_ACCELERATION = 14.0;

const RESTITUTION = 0;

const MAX_VX = 25.0; // vx 상한값 정의


/* =========================================================
   LANDING / DIFFICULTY
   ========================================================= */

const SOFT_LANDING_THRESHOLD = 9.0;

const BASE_COMBO_REQUIRED_Y = 4.0;
const MAX_COMBO_REQUIRED_Y = 9.0;

function getRequiredComboY() {

    const gaugeRatio =
        Math.max(
            0,
            Math.min(
                1,
                difficultyGauge / DIFFICULTY_MAX
            )
        );

    return (
        BASE_COMBO_REQUIRED_Y
        +
        (
            MAX_COMBO_REQUIRED_Y
            -
            BASE_COMBO_REQUIRED_Y
        )
        *
        gaugeRatio
    );
}

const HARD_LANDING_THRESHOLD = 12.5;

const DIFFICULTY_SOFT_LANDING_GAIN = 10;

const DIFFICULTY_COMBO_GAIN = 12;

const DIFFICULTY_MAX = 100;

const GROUND_CONTACT_EPSILON = 0.03;


/* =========================================================
   COMBO GRAPHICS & AIRTIME
   ========================================================= */

let comboPulse = 0;
let comboPulseMax = 0.70;

let comboPopup = null;

// 체류 점수 기본 구간 (1점, 2점, 4점, 8점)
const AIRTIME_BONUS_THRESHOLDS = [
    { time: 0.4, score: 1 },
    { time: 0.8, score: 3 },
    { time: 1.2, score: 7 },
    { time: 1.6, score: 15 }
];

let currentJumpAirTime = 0;
let airtimeBonusScore = 0;
let airtimeBonusPopup = null;

const COMBO_COLORS = [
    [55, 100, 62],   // yellow
    [0, 100, 62],    // red
    [275, 100, 68],  // purple
    [210, 20, 15]    // 다크 차콜
];

// 콤보 및 공의 상태에 맞는 색상을 리턴
function getComboColor(comboNumber, alpha = 1) {
    if (comboNumber <= 0) {
        return `rgba(255, 255, 255, ${alpha})`; // 0콤보 시 기본 흰색
    }

    const index =
        Math.min(
            comboNumber,
            COMBO_COLORS.length
        ) - 1;

    const [hue, saturation, lightness] =
        COMBO_COLORS[index];

    return `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
}

function getComboAuraScale(comboNumber) {

    return Math.min(
        2.2,
        1.0 + comboNumber * 0.08
    );
}


/* =========================================================
   MOBILE TOUCH INPUT
   ========================================================= */

let touchPointerActive = false;

canvas.addEventListener(
    "pointerdown",
    function(e) {

        if (e.pointerType !== "touch") {
            return;
        }

        e.preventDefault();

        touchPointerActive = true;

        mouseLeft = true;

        if (gameOver) {
            touchPointerActive = false;
            mouseLeft = false;
            reset();
        }

    },
    { passive: false }
);

window.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerType === "touch"
            &&
            touchPointerActive
        ) {

            e.preventDefault();

            touchPointerActive = false;
            mouseLeft = false;
        }

    },
    { passive: false }
);

window.addEventListener(
    "pointercancel",
    function(e) {

        if (e.pointerType === "touch") {

            touchPointerActive = false;
            mouseLeft = false;
        }

    },
    { passive: false }
);

window.addEventListener(
    "blur",
    function() {

        touchPointerActive = false;
        mouseLeft = false;

    }
);


/* =========================================================
   INPUT
   ========================================================= */

let mouseLeft = false;

canvas.addEventListener(
    "mousedown",
    function(e) {

        if (e.button === 0) {

            mouseLeft = true;
        }
    }
);

window.addEventListener(
    "mouseup",
    function(e) {

        if (e.button === 0) {

            mouseLeft = false;
        }
    }
);

window.addEventListener(
    "blur",
    function() {

        mouseLeft = false;
        remoteOnePressed = false;
    }
);

window.addEventListener(
    "mousedown",
    function(e) {

        if (gameOver && e.button === 0) {

            reset();
        }
    }
);


/* =========================================================
   ANDROID TV REMOTE INPUT
   ========================================================= */

let remoteOnePressed = false;

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Digit1"
            || e.code === "Numpad1"
            || e.key === "1"
        ) {

            e.preventDefault();

            if (!remoteOnePressed) {
                remoteOnePressed = true;
                mouseLeft = true;

                if (gameOver) {
                    remoteOnePressed = false;
                    mouseLeft = false;
                    reset();
                }
            }
        }
    }
);

window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.code === "Digit1"
            || e.code === "Numpad1"
            || e.key === "1"
        ) {

            e.preventDefault();

            remoteOnePressed = false;
            mouseLeft = false;
        }
    }
);


/* =========================================================
   VECTOR
   ========================================================= */

function dot(
    ax,
    ay,
    bx,
    by
) {

    return (
        ax * bx
        +
        ay * by
    );
}


/* =========================================================
   GAME STATE
   ========================================================= */

let score = 0;

let combo = 0;

let bestCombo = 0;

let lastLandingScore = 0;

let lastImpactSpeed = 0;

let difficultyGauge = 0;

let gameOver = false;

let nextScoreBlockIndex = 0;

function getGroundAcceleration() {

    return Math.min(
        RIGHT_ACCELERATION
        +
        combo * COMBO_ACCELERATION_BONUS,

        30
    );
}


/* =========================================================
   LANDING HANDLER
   ========================================================= */

function handleLanding(impactSpeed, jumpHeight) {

    lastImpactSpeed = impactSpeed;

    // 유예 시간이 남아있거나 vy가 5 이하여서 봐주는 상황
    if (player.impactGraceTime > 0 || Math.abs(player.vy) <= 4.0) {
        return true;
    }

    const jumpWorldHeight = Math.max(0, jumpHeight - player.jumpBaseY);
    const jumpPixelHeight = jumpWorldHeight * camera.zoom;

    if (
        impactSpeed
        >= HARD_LANDING_THRESHOLD * (1 + 0.4 * difficultyGauge / DIFFICULTY_MAX) * (1 + 0.2 * jumpPixelHeight / H)
    ) {

        gameOver = true;

        lastLandingScore = 0;

        player.y = terrainHeight(player.x) + player.radius;
        player.vy = 0;

        return false;
    }

    if (
        impactSpeed
        <= SOFT_LANDING_THRESHOLD * (1 + 0.3 * difficultyGauge / DIFFICULTY_MAX) * (1 + 0.3 * jumpPixelHeight / H)
    ) {

        const quality =
            Math.max(
                0,
                Math.min(
                    1,
                    1
                    -
                    impactSpeed
                    /
                    SOFT_LANDING_THRESHOLD
                )
            );

        const requiredY =
            getRequiredComboY();

        if (
            jumpHeight
            >=
            requiredY
        ) {

            combo += 1;

            bestCombo =
                Math.max(
                    bestCombo,
                    combo
                );

            lastLandingScore =
                combo;

            score +=
                combo * combo;

            triggerComboEffect();

        } else {

            combo = 0;
            comboPulse = 0;
            lastLandingScore = 0;
        }

        difficultyGauge +=
            DIFFICULTY_SOFT_LANDING_GAIN
            *
            quality
            +
            DIFFICULTY_COMBO_GAIN
            *
            combo;

        difficultyGauge =
            Math.min(
                DIFFICULTY_MAX,
                difficultyGauge
            );

        player.impactGraceTime = 0.7;

        return true;
    }

    combo = 0;
    comboPulse = 0;

    lastLandingScore = 0;

    difficultyGauge *= 0.5;

    player.impactGraceTime = 0.2;

    return true;
}


/* =========================================================
   COMBO GRAPHICS
   ========================================================= */

function triggerComboEffect() {

    const color =
        getComboColor(combo);

    comboPulse = comboPulseMax;

    comboPopup = {

        x: player.x + 0.34,

        y: player.y + 0.24,

        vx: 0.65,

        vy: 0.85,

        life: 0.90,

        maxLife: 0.90,

        text: `×${combo}`,

        color: color
    };
}

function triggerAirtimeBonusEffect(gained) {

    airtimeBonusPopup = {
        x: player.x + 0.30,
        y: player.y + 0.30,
        vx: 0.45,
        vy: 0.75,
        life: 0.70,
        maxLife: 0.70,
        text: `+${gained}`,
        // 현재 공의 콤보 상태 색상과 완전히 일치하도록 적용
        color: getComboColor(combo)
    };
}

function updateComboEffects(dt) {

    if (comboPopup) {

        comboPopup.x +=
            comboPopup.vx * dt;

        comboPopup.y +=
            comboPopup.vy * dt;

        comboPopup.vx *=
            Math.exp(-4 * dt);

        comboPopup.vy *=
            Math.exp(-2 * dt);

        comboPopup.life -= dt;

        if (comboPopup.life <= 0) {
            comboPopup = null;
        }
    }
}


/* =========================================================
   BLOCK SCORE
   ========================================================= */

let passedBlockCount = 0;

function checkPassedBlocks() {

    ensureTerrainTo(
        player.x
    );

    while (
        nextScoreBlockIndex
        < terrainBlocks.length
        &&
        player.x
        >=
        terrainBlocks[
            nextScoreBlockIndex
        ].end
    ) {
        passedBlockCount += 1;

        if (passedBlockCount % 3 === 0) {
            const multiplier = Math.max(1, combo + 1);
            score += 1 * multiplier;
        }

        nextScoreBlockIndex += 1;
    }
}


/* =========================================================
   PHYSICS STEP
   ========================================================= */

function physicsStep(dt) {

    if (gameOver) {
        return;
    }

    if (player.impactGraceTime > 0) {
        player.impactGraceTime -= dt;
    }

    const currentWorldHeight = Math.max(0, player.y - player.jumpBaseY);
    const currentPixelHeight = currentWorldHeight * camera.zoom;
    const heightRatio = currentPixelHeight / H;
    const gravityMultiplier = 1.0 + Math.pow(heightRatio, 2);

    player.vy -= GRAVITY * gravityMultiplier * dt;

    if (mouseLeft) {

        if (player.grounded) {

            player.vx +=
                getGroundAcceleration() * dt;

        } else {

            player.vy -=
                DOWN_ACCELERATION * dt;
        }
    }

    // vx 상한을 16으로 제한
    player.vx = Math.min(player.vx, MAX_VX);

    player.x +=
        player.vx * dt;

    player.y +=
        player.vy * dt;

    if (!player.grounded) {

        currentJumpAirTime += dt;

        player.maxJumpHeight =
            Math.max(
                player.maxJumpHeight,
                player.y
            );

        if (player.vy > 0) {

            let newBonus = 0;

            for (const tier of AIRTIME_BONUS_THRESHOLDS) {
                if (currentJumpAirTime >= tier.time) {
                    newBonus = tier.score;
                }
            }

            if (newBonus > airtimeBonusScore) {

                const gained = newBonus - airtimeBonusScore;
                airtimeBonusScore = newBonus;

                // 0콤보 시 n = 1 가중치 적용, 1콤보 이상 시 n = combo 가중치 적용
                const multiplier = Math.max(1, combo + 1);
                const weightedGained = gained * multiplier;

                score += weightedGained;

                triggerAirtimeBonusEffect(weightedGained);
            }
        }
    }

    checkPassedBlocks();

    const ground =
        terrainHeight(
            player.x
        );

    const slope =
        terrainSlope(
            player.x
        );

    const tangentLength =
        Math.sqrt(
            1 + slope * slope
        );

    const tx =
        1 / tangentLength;

    const ty =
        slope / tangentLength;

    const nx =
        -slope / tangentLength;

    const ny =
        1 / tangentLength;

    const bottom =
        player.y
        -
        player.radius;

    const penetration =
        ground
        -
        bottom;

    const normalVelocity =
        dot(
            player.vx,
            player.vy,
            nx,
            ny
        );

    const separation =
        bottom - ground;

    const actualTakeoff =
        player.grounded
        &&
        !player.jumpActive
        &&
        separation > GROUND_CONTACT_EPSILON;

    if (actualTakeoff) {

        player.grounded = false;

        player.jumpActive = true;

        player.jumpBaseY = ground;

        player.maxJumpHeight =
            player.y;

        currentJumpAirTime = 0;
        airtimeBonusScore = 0;
        airtimeBonusPopup = null;
    }

    if (penetration > 0) {

        if (normalVelocity < 0) {

            if (player.jumpActive) {

                const impactSpeed =
                    -normalVelocity;

                const jumpHeight =
                    player.maxJumpHeight;

                const landingSucceeded =
                    handleLanding(
                        impactSpeed,
                        jumpHeight
                    );

                if (!landingSucceeded) {

                    player.vx = 0;
                    player.vy = 0;

                    return;
                }

                player.jumpActive = false;
            }

            const tangentVelocity =
                dot(
                    player.vx,
                    player.vy,
                    tx,
                    ty
                );

            const newNormalVelocity =
                -normalVelocity
                *
                RESTITUTION;

            player.vx =
                tangentVelocity * tx
                +
                newNormalVelocity * nx;

            player.vy =
                tangentVelocity * ty
                +
                newNormalVelocity * ny;

            player.y =
                ground
                +
                player.radius;

            player.grounded = true;

            player.maxJumpHeight =
                player.y;

        } else {

            if (player.jumpActive) {

                player.grounded = false;

            } else if (
                separation <= GROUND_CONTACT_EPSILON
            ) {

                player.y =
                    ground
                    +
                    player.radius;

                player.grounded = true;

            } else {

                player.grounded = false;
            }
        }

    } else {

        if (player.jumpActive) {

            player.grounded = false;

        } else if (
            separation <= GROUND_CONTACT_EPSILON
        ) {

            player.grounded = true;

        } else {

            player.grounded = false;
        }
    }

    if (player.jumpActive) {

        player.maxJumpHeight =
            Math.max(
                player.maxJumpHeight,
                player.y
            );
    }

    if (player.y < -10) {

        reset();
    }
}


/* =========================================================
   CAMERA
   ========================================================= */

const camera = {

    centerX: 3,

    zoom: 95
};

const CAMERA_BOTTOM_Y = -2;

const MAX_ZOOM = 95;

const MIN_ZOOM = 55;

const CAMERA_REFERENCE_WIDTH = 1600;
const CAMERA_REFERENCE_HEIGHT = 900;

function getViewportScale() {
    return W / CAMERA_REFERENCE_WIDTH;
}

function getResponsiveMaxZoom() {
    return MAX_ZOOM * getViewportScale();
}

function getResponsiveMinZoom() {
    return MIN_ZOOM * getViewportScale();
}

const CAMERA_LOOK_AHEAD = 3.0;

const CAMERA_X_SPEED = 20;

const CAMERA_RIGHT_LIMIT = 0.72;

const ZOOM_HEIGHT_FACTOR_UP = 11;

const ZOOM_HEIGHT_FACTOR_DOWN = 20;

const ZOOM_SPEED = 3.0;

const TIME_SLOW_HEIGHT = 2.0;
const MIN_TIME_SCALE = 0.8;

function getTimeScale() {

    const height =
        Math.max(
            0,
            player.y - player.jumpBaseY - player.radius
        );

    const ratio =
        Math.min(
            1,
            height / TIME_SLOW_HEIGHT
        );

    return 1 - (1 - MIN_TIME_SCALE) * ratio;
}


/* =========================================================
   CAMERA UPDATE
   ========================================================= */

function updateCamera(dt) {

    let targetZoom;

    const ZOOM_HEIGHT_FACTOR = (!player.grounded && player.vy > 0)
        ? ZOOM_HEIGHT_FACTOR_UP
        : ZOOM_HEIGHT_FACTOR_DOWN;

    const height =
        Math.max(
            0,
            player.y
            -
            player.jumpBaseY
            -
            player.radius
        );

    targetZoom =
        getResponsiveMaxZoom()
        -
        height
        *
        ZOOM_HEIGHT_FACTOR
        *
        getViewportScale();

    targetZoom =
        Math.max(
            getResponsiveMinZoom(),
            Math.min(
                getResponsiveMaxZoom(),
                targetZoom
            )
        );

    const zoomSmooth =
        1 -
        Math.exp(
            -ZOOM_SPEED * dt
        );

    camera.zoom +=
        (
            targetZoom
            -
            camera.zoom
        )
        *
        zoomSmooth;

    let targetCenterX =
        player.x
        +
        CAMERA_LOOK_AHEAD;

    const playerScreenX =
        screenX(
            player.x
        );

    if (
        playerScreenX
        >
        W * CAMERA_RIGHT_LIMIT
    ) {

        const safetyCenterX =
            player.x
            -
            (
                W * 0.50
            )
            /
            camera.zoom;

        targetCenterX =
            Math.max(
                targetCenterX,
                safetyCenterX
            );
    }

    targetCenterX =
        Math.max(
            targetCenterX,
            camera.centerX
        );

    const xSmooth =
        1 -
        Math.exp(
            -CAMERA_X_SPEED * dt
        );

    camera.centerX +=
        (
            targetCenterX
            -
            camera.centerX
        )
        *
        xSmooth;

    const newPlayerScreenX =
        screenX(
            player.x
        );

    if (
        newPlayerScreenX
        >
        W * 0.82
    ) {

        const emergencyCenterX =
            player.x
            -
            (
                W * 0.45
            )
            /
            camera.zoom;

        if (
            emergencyCenterX
            >
            camera.centerX
        ) {

            camera.centerX +=
                (
                    emergencyCenterX
                    -
                    camera.centerX
                )
                *
                Math.min(
                    1,
                    20 * dt
                );
        }
    }
}


/* =========================================================
   WORLD → SCREEN
   ========================================================= */

function screenX(x) {

    return (
        (
            x
            -
            camera.centerX
        )
        *
        camera.zoom
        +
        W * 0.5
    );
}

function screenY(y) {

    return (
        H
        -
        (
            y
            -
            CAMERA_BOTTOM_Y
        )
        *
        camera.zoom
    );
}


/* =========================================================
   BACKGROUND DRAW
   ========================================================= */

function drawBackground() {

    const baseLightness = 9.4; 
    const maxLightness = 28.0; 
    
    const comboRatio = Math.min(1, combo / 8); 
    const currentLightness = baseLightness + (maxLightness - baseLightness) * comboRatio;

    ctx.fillStyle = `hsl(210, 33%, ${currentLightness}%)`;
    ctx.fillRect(0, 0, W, H);

    const dotAlpha = 0.08 + comboRatio * 0.22; 
    ctx.fillStyle = `rgba(255, 255, 255, ${dotAlpha})`;

    const spacing = 80;

    for (let x = 0; x < W; x += spacing) {
        for (let y = 0; y < H * 0.5; y += spacing) {
            ctx.beginPath();

            const dotSize = 1 + comboRatio * 0.8; 

            ctx.arc(
                x + ((y * 13) % 40),
                y + ((x * 7) % 30),
                dotSize,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }
    }
}


/* =========================================================
   TERRAIN DRAW
   ========================================================= */

function drawTerrain() {

    const visibleHalfWidth =
        W
        /
        (
            2
            *
            camera.zoom
        );

    const leftWorld =
        camera.centerX
        -
        visibleHalfWidth
        -
        2;

    const rightWorld =
        camera.centerX
        +
        visibleHalfWidth
        +
        2;

    ensureTerrainTo(
        rightWorld
    );

    const step = 0.035;

    ctx.beginPath();

    let x =
        leftWorld;

    let y =
        terrainHeight(x);

    ctx.moveTo(
        screenX(x),
        screenY(y)
    );

    for (
        x = leftWorld + step;
        x <= rightWorld;
        x += step
    ) {

        y =
            terrainHeight(x);

        ctx.lineTo(
            screenX(x),
            screenY(y)
        );
    }

    ctx.lineTo(
        screenX(rightWorld),
        H + 100
    );

    ctx.lineTo(
        screenX(leftWorld),
        H + 100
    );

    ctx.closePath();

    ctx.fillStyle =
        "#263238";

    ctx.fill();

    ctx.beginPath();

    x =
        leftWorld;

    y =
        terrainHeight(x);

    ctx.moveTo(
        screenX(x),
        screenY(y)
    );

    for (
        x = leftWorld + step;
        x <= rightWorld;
        x += step
    ) {

        y =
            terrainHeight(x);

        ctx.lineTo(
            screenX(x),
            screenY(y)
        );
    }

    ctx.strokeStyle =
        "#eeeeee";

    ctx.lineWidth =
        Math.max(
            0.8,
            2 * getViewportScale()
        );

    ctx.stroke();
}


/* =========================================================
   PLAYER DRAW
   ========================================================= */

function drawPlayer() {

    const sx =
        screenX(
            player.x
        );

    const sy =
        screenY(
            player.y
        );

    const radius =
        player.radius
        *
        camera.zoom;

    if (combo > 0) {

        const progress = 0;

        const comboNumber =
            Math.max(1, combo);

        const auraScale =
            getComboAuraScale(comboNumber);

        const color =
            getComboColor(
                comboNumber,
                1
            );

        const pulseRadius =
            radius
            *
            (
                1.10
                +
                progress * 0.95
            )
            *
            auraScale;

        ctx.save();

        ctx.globalAlpha =
            0.62 * (1 - progress);

        ctx.strokeStyle = color;

        ctx.lineWidth =
            2.5
            +
            Math.min(
                comboNumber,
                10
            ) * 0.20;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            pulseRadius,
            0,
            Math.PI * 2
        )

        ctx.stroke();

        ctx.restore();

        const glowRadius =
            radius
            *
            (
                2.0
                +
                auraScale * 0.45
            );

        const gradient =
            ctx.createRadialGradient(
                sx,
                sy,
                radius * 0.20,
                sx,
                sy,
                glowRadius
            );

        gradient.addColorStop(
            0,
            getComboColor(
                comboNumber,
                0.62
            )
        );

        gradient.addColorStop(
            0.35,
            getComboColor(
                comboNumber,
                0.25
            )
        );

        gradient.addColorStop(
            1,
            getComboColor(
                comboNumber,
                0
            )
        );

        ctx.save();

        ctx.globalAlpha =
            1 - progress;

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            glowRadius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }

    ctx.beginPath();

    ctx.arc(
        sx + radius * 0.12,
        sy + radius * 0.15,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.3)";

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        radius,
        0,
        Math.PI * 2
    );

    // 공의 색상 (combo 0일 때는 흰색 #ffffff가 리턴됨)
    ctx.fillStyle = getComboColor(combo, combo > 0 ? 0.72 : 1.0);

    ctx.fill();

    ctx.strokeStyle =
        "#111111";

    ctx.lineWidth = 2;

    ctx.stroke();

    if (airtimeBonusPopup) {

        const alpha =
            Math.max(
                0,
                airtimeBonusPopup.life /
                airtimeBonusPopup.maxLife
            );

        const bonusX =
            screenX(airtimeBonusPopup.x);

        const bonusY =
            screenY(airtimeBonusPopup.y);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(bonusX, bonusY);
        ctx.rotate(-Math.PI / 12);

        ctx.fillStyle =
            airtimeBonusPopup.color;

        ctx.font = "bold 20px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        ctx.shadowColor =
            "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 2;

        ctx.fillText(
            airtimeBonusPopup.text,
            0,
            0
        );

        ctx.restore();
    }

    if (comboPopup) {

        const alpha =
            Math.max(
                0,
                comboPopup.life
                /
                comboPopup.maxLife
            );

        const popupX =
            screenX(comboPopup.x);

        const popupY =
            screenY(comboPopup.y);

        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.translate(
            popupX,
            popupY
        );

        ctx.rotate(-Math.PI / 12);

        ctx.fillStyle =
            comboPopup.color;

        ctx.font =
            "bold 22px Arial";

        ctx.textAlign =
            "left";

        ctx.textBaseline =
            "middle";

        ctx.shadowColor =
            "rgba(0,0,0,0.55)";

        ctx.shadowBlur = 4;

        ctx.shadowOffsetX = 1;

        ctx.shadowOffsetY = 2;

        ctx.fillText(
            comboPopup.text,
            0,
            0
        );

        ctx.restore();
    }
}


/* =========================================================
   LANDING THRESHOLD GUIDE
   ========================================================= */

function drawGuideLine(worldY) {

    const sy =
        screenY(worldY);

    if (
        sy < -40
        ||
        sy > H + 40
    ) {
        return;
    }

    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        0,
        sy
    );

    ctx.lineTo(
        W,
        sy
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.70)";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.restore();
}

function updateLandingGuide(dt) {

    const targetY =
        getRequiredComboY();

    const smooth =
        1 - Math.exp(-8.0 * dt);

    landingGuideY +=
        (targetY - landingGuideY)
        *
        smooth;
}

function drawLandingThreshold() {

    if (gameOver) {
        return;
    }

    drawGuideLine(
        landingGuideY
    );
}


/* =========================================================
   HUD
   ========================================================= */

function drawHUD() {

    ctx.fillStyle =
        "rgba(255,255,255,0.9)";

    ctx.textAlign = "left";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        `점수: ${score}`,
        16,
        30
    );

    if (gameOver) {

        ctx.textAlign = "center";

        ctx.fillStyle =
            "rgba(0,0,0,0.55)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 42px Arial";

        ctx.fillText(
            "GAME OVER",
            W / 2,
            H / 2 - 24
        );

        ctx.font =
            "20px Arial";

        ctx.fillText(
            `점수 ${score}`,
            W / 2,
            H / 2 + 18
        );
    }

    ctx.textAlign = "left";
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    drawBackground();

    drawTerrain();

    drawLandingThreshold();

    drawPlayer();

    drawHUD();
}


/* =========================================================
   RESET
   ========================================================= */

function reset() {

    score = 0;

    combo = 0;

    bestCombo = 0;

    lastLandingScore = 0;

    lastImpactSpeed = 0;

    difficultyGauge = 0;

    gameOver = false;

    nextScoreBlockIndex = 0;

    passedBlockCount = 0;

    comboPulse = 0;
    comboPopup = null;
    currentJumpAirTime = 0;
    airtimeBonusScore = 0;
    airtimeBonusPopup = null;

    terrainBlocks = [];

    const startType =
        TERRAIN_TYPES[0];

    terrainBlocks.push({

        type: 0,

        name: startType.name,

        scale: 1.0,

        start: 0,

        end: startType.width
    });

    generateNextTerrainBlock();

    player.x = 0;

    player.y =
        terrainHeight(0)
        +
        player.radius
        +
        0.001;

    player.vx = 0;

    player.vy = 0;

    player.grounded = true;

    player.jumpActive = false;

    player.impactGraceTime = 0;

    player.jumpBaseY =
        terrainHeight(0);

    player.jumpBaseX =
        player.x;

    player.maxJumpHeight =
        player.y;

    landingGuideY =
        getRequiredComboY();

    camera.zoom =
        MAX_ZOOM;

    camera.centerX =
        player.x
        +
        CAMERA_LOOK_AHEAD;
}


/* =========================================================
   GAME LOOP
   ========================================================= */

let previousTime =
    performance.now();

function loop(time) {

    let dt =
        (
            time
            -
            previousTime
        )
        /
        1000;

    previousTime =
        time;

    dt =
        Math.min(
            dt,
            0.05
        );

    const timeScale = getTimeScale();
    const gameDt = dt * timeScale;

    const FIXED_STEP =
        1 / 120;

    let remaining =
        gameDt;

    while (remaining > 0) {

        const step =
            Math.min(
                FIXED_STEP,
                remaining
            );

        physicsStep(step);

        remaining -= step;
    }

    updateCamera(gameDt);

    updateLandingGuide(gameDt);

    updateComboEffects(gameDt);

    render();

    requestAnimationFrame(loop);
}


/* =========================================================
   START
   ========================================================= */

reset();

requestAnimationFrame(loop);

</script>
