<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gravity Platformer</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #101820;
    font-family: Arial, sans-serif;
}

canvas {
    touch-action: none;
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

/* =========================================================
   CANVAS
   ========================================================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener("resize", resize);

resize();


/* =========================================================
   TERRAIN FUNCTIONS
   ========================================================= */

/*
    start(x)

        1
            -2π < x < 0

        0.5 * (cos(x/5) + 1)
             0 < x < 5π

    전체 길이 = 7π

    u:
        0 ~ 7π

    x:
        -2π ~ 5π
*/

function terrainStart(u) {

    const x = u;

    if (x < 0.5 * Math.PI) {
        return 0.8
    }

    return 0.4 * (
        Math.cos(
            (x - 0.5 * Math.PI) / 1.5
        ) + 1
    );
}


/*
    f(x) = 0.8 * (cos(x / 1.1) + 1)

    -1.1π < x < 1.1π

    가로 길이 = 2.2π
*/

function terrainF(u) {

    const x =
        u - 1.1 * Math.PI;

    return 0.8 * (
        Math.cos(
            x / 1.1
        ) + 1
    );
}


/*
    g(x) = 1.2 - |cos(x / 1.4) - 0.2|

    -1.4π < x < 1.4π

    가로 길이 = 2.8π
*/

function terrainG(u) {

    const x =
        u - 1.4 * Math.PI;

    return 1.2 - Math.abs(
        Math.cos(
            x / 1.4
        ) - 0.2
    );
}


/*
    h(x)

        0.6 * (cos(x / 0.75) + 1)
            -0.75π < x < 0

        0.6 * (cos(x / (2 * 0.75)) + 1)
             0 < x < 1.5π

    가로 길이 = 2.25π
*/

function terrainH(u) {

    const x =
        u - 0.75 * Math.PI;

    if (x < 0) {

        return 0.6 * (
            Math.cos(
                x / 0.75
            ) + 1
        );
    }

    return 0.6 * (
        Math.cos(
            x / 0.75 / 2
        ) + 1
    );
}


/* =========================================================
   TERRAIN TYPES
   ========================================================= */

const TERRAIN_TYPES = [

    /*
        0번 = 시작 전용
        랜덤 선택에서는 제외
    */

    {
        name: "start",
        width: 2 * Math.PI,
        height: terrainStart
    },

    {
        name: "f",
        width: 2.2 * Math.PI,
        height: terrainF
    },

    {
        name: "g",
        width: 2.8 * Math.PI,
        height: terrainG
    },

    {
        name: "h",
        width: 2.25 * Math.PI,
        height: terrainH
    }

];


/* =========================================================
   RANDOM TERRAIN BLOCKS
   ========================================================= */

let terrainBlocks = [];


/*
    랜덤 지형 하나 생성

    start는 제외하고
    f / g / h 중에서 선택한다.
*/

function generateNextTerrainBlock() {

    const typeIndex =
        1 +
        Math.floor(
            Math.random()
            * (
                TERRAIN_TYPES.length - 1
            )
        );


    const type =
        TERRAIN_TYPES[typeIndex];


    /* 선택된 지형의 가로/세로 배율: 1.0 ~ 1.8 */
    const scale =
        1.0 + Math.random() * 0.5;


    const start =
        terrainBlocks.length === 0
            ? 0
            : terrainBlocks[
                terrainBlocks.length - 1
            ].end;


    terrainBlocks.push({

        type: typeIndex,

        name: type.name,

        scale: scale,

        start: start,

        end: start + type.width * scale
    });
}


/*
    x까지 지형을 미리 만든다.
*/

function ensureTerrainTo(x) {

    if (x <= 0) {
        return;
    }


    while (
        terrainBlocks.length === 0
        ||
        terrainBlocks[
            terrainBlocks.length - 1
        ].end < x
    ) {

        generateNextTerrainBlock();
    }
}


/*
    특정 x가 어느 블럭인지 찾는다.
*/

function findTerrainBlock(x) {

    if (x < 0) {
        return null;
    }


    ensureTerrainTo(x);


    let left = 0;

    let right =
        terrainBlocks.length - 1;


    while (left <= right) {

        const mid =
            Math.floor(
                (left + right) / 2
            );


        const block =
            terrainBlocks[mid];


        if (x < block.start) {

            right = mid - 1;

        } else if (x > block.end) {

            left = mid + 1;

        } else {

            return block;
        }
    }


    return null;
}


/* =========================================================
   TERRAIN HEIGHT
   ========================================================= */

function terrainHeight(x) {

    /*
        시작점 왼쪽은 평지
    */

    if (x < 0) {
        return 0.8;
    }


    const block =
        findTerrainBlock(x);


    if (!block) {
        return 0;
    }


    const type =
        TERRAIN_TYPES[
            block.type
        ];


    const scale =
        block.scale || 1.0;


    /* 가로로 scale만큼 늘어난 블럭을 원래 좌표로 변환 */
    const localX =
        (x - block.start) / scale;


    /* 세로도 동일한 scale 적용 */
    return type.height(localX) * scale;
}


/* =========================================================
   TERRAIN SLOPE
   ========================================================= */

function terrainSlope(x) {

    if (x < 0) {
        return 0;
    }


    const dx = 0.0001;


    return (
        terrainHeight(
            x + dx
        )
        -
        terrainHeight(
            x - dx
        )
    )
    /
    (2 * dx);
}


/* =========================================================
   PLAYER
   ========================================================= */

const player = {

    x: 0,

    y: 0,

    vx: 0,

    vy: 0,

    radius: 0.16,

    grounded: true,

    /*
        이번 점프가 시작된 지면의 높이
    */

    jumpBaseY: 0,

    /*
        이번 점프가 시작된 월드 X
    */

    jumpBaseX: 0,

    /*
        이번 점프에서 도달한 최고 높이
    */

    maxJumpHeight: 0,

    jumpActive: false
};


/*
    현재 점프에서 요구되는 최소 높이를
    화면에 표시하기 위한 가이드 위치.

    실제 목표값과 분리해서 부드럽게 이동시킨다.
*/
let landingGuideY = 0;


/* =========================================================
   PHYSICS CONSTANTS
   ========================================================= */

const GRAVITY = 8.0;


/*
    지면에서 좌클릭
*/

const RIGHT_ACCELERATION = 12.0;


/*
    콤보 1회당 지면 가속도 증가량
*/

const COMBO_ACCELERATION_BONUS = 0.9;


/*
    공중에서 좌클릭
*/

const DOWN_ACCELERATION = 17.0;


/*
    충돌시 튕김

    0 = 튕기지 않음
*/

const RESTITUTION = 0;


/* =========================================================
   LANDING / DIFFICULTY
   ========================================================= */

/*
    법선속도:

        normalVelocity = v · n

    n은 지면의 위쪽 법선이므로
    착지 순간에는 음수가 된다.

    따라서 충돌 속도는:

        impactSpeed = -normalVelocity
*/


/*
    이 값 이하이면 소프트 랜딩
*/

const SOFT_LANDING_THRESHOLD = 7.5;


/*
    콤보를 만들기 위해 필요한 절대 y 좌표

    난이도 게이지의 현재 비율에 따라
    BASE_COMBO_REQUIRED_Y에서 MAX_COMBO_REQUIRED_Y까지
    연속적으로 증가한다.
*/

const BASE_COMBO_REQUIRED_Y = 5.0;
const MAX_COMBO_REQUIRED_Y = 10.0;


/*
    현재 난이도에서 콤보를 만들기 위해
    도달해야 하는 절대 y 좌표

    gauge / DIFFICULTY_MAX
    = 현재 난이도 게이지의 비율
*/

function getRequiredComboY() {

    const gaugeRatio =
        Math.max(
            0,
            Math.min(
                1,
                difficultyGauge / DIFFICULTY_MAX
            )
        );


    return (
        BASE_COMBO_REQUIRED_Y
        +
        (
            MAX_COMBO_REQUIRED_Y
            -
            BASE_COMBO_REQUIRED_Y
        )
        *
        gaugeRatio
    );
}


/*
    이 값 이상이면 하드 랜딩
    → 게임 종료
*/

const HARD_LANDING_THRESHOLD = 12.0;


/*
    점수는 지형 블럭 통과와
    소프트 랜딩 콤보로만 획득한다.
*/

/*
    난이도 게이지

    원래 피버 게이지와 같은 방식으로 증가/감소하지만
    보상이 아니라 착지 요구 높이를 높이는 데 사용한다.
*/

const DIFFICULTY_SOFT_LANDING_GAIN = 18;

const DIFFICULTY_COMBO_GAIN = 4;

const DIFFICULTY_MAX = 100;


/*
    지면에서 발생하는 미세한 튐은 실제 점프로 취급하지 않는다.
*/

const GROUND_CONTACT_EPSILON = 0.03;


/* =========================================================
   COMBO GRAPHICS
   ========================================================= */

/*
    콤보마다 색과 오라의 성격을 다르게 한다.
    콤보가 올라갈수록 색상이 순환하고
    오라의 크기와 강도도 조금씩 증가한다.
*/

let comboPulse = 0;
let comboPulseMax = 0.70;

let comboPopup = null;

const AIRTIME_BONUS_THRESHOLDS = [
    { time: 0.5, score: 2 },
    { time: 1.0, score: 4 },
    { time: 1.5, score: 8 }
];

let currentJumpAirTime = 0;
let airtimeBonusScore = 0;
let airtimeBonusPopup = null;


const COMBO_COLORS = [
    [55, 100, 62],   // yellow
    [0, 100, 62],    // red
    [275, 100, 68],  // purple
    [0, 0, 0]        // black (4+)
];


function getComboColor(comboNumber, alpha = 1) {

    const index =
        Math.min(
            Math.max(comboNumber, 1),
            COMBO_COLORS.length
        ) - 1;

    const [hue, saturation, lightness] =
        COMBO_COLORS[index];

    return `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
}


function getComboAuraScale(comboNumber) {

    return Math.min(
        2.2,
        1.0 + comboNumber * 0.08
    );
}



/* =========================================================
   MOBILE TOUCH INPUT
   ========================================================= */

/*
   이 게임의 실제 입력 상태는 mouseLeft다.
   따라서 모바일에서는 click을 만들어내는 것보다
   pointer 이벤트에서 mouseLeft를 직접 바꾸는 것이 정확하다.
*/

let touchPointerActive = false;

canvas.addEventListener(
    "pointerdown",
    function(e) {

        if (e.pointerType !== "touch") {
            return;
        }

        e.preventDefault();

        touchPointerActive = true;

        /*
           마우스를 누른 것과 동일하게 처리.
           화면을 터치하고 있는 동안 mouseLeft === true.
        */
        mouseLeft = true;

        /*
           게임오버 상태에서는 기존 PC의
           왼쪽 마우스 클릭과 동일하게 즉시 재시작.
        */
        if (gameOver) {
            touchPointerActive = false;
            mouseLeft = false;
            reset();
        }

    },
    { passive: false }
);


window.addEventListener(
    "pointerup",
    function(e) {

        if (
            e.pointerType === "touch"
            &&
            touchPointerActive
        ) {

            e.preventDefault();

            touchPointerActive = false;
            mouseLeft = false;
        }

    },
    { passive: false }
);


window.addEventListener(
    "pointercancel",
    function(e) {

        if (e.pointerType === "touch") {

            touchPointerActive = false;
            mouseLeft = false;
        }

    },
    { passive: false }
);


/*
   손가락이 화면 밖으로 나간 경우에도
   입력이 계속 눌린 상태로 남지 않도록 한다.
*/

window.addEventListener(
    "blur",
    function() {

        touchPointerActive = false;
        mouseLeft = false;

    }
);


/* =========================================================
   INPUT
   ========================================================= */

let mouseLeft = false;


canvas.addEventListener(
    "mousedown",
    function(e) {

        if (e.button === 0) {

            mouseLeft = true;
        }
    }
);


window.addEventListener(
    "mouseup",
    function(e) {

        if (e.button === 0) {

            mouseLeft = false;
        }
    }
);


window.addEventListener(
    "blur",
    function() {

        mouseLeft = false;
        remoteOnePressed = false;
    }
);


window.addEventListener(
    "mousedown",
    function(e) {

        if (gameOver && e.button === 0) {

            reset();
        }
    }
);



/* =========================================================
   ANDROID TV REMOTE INPUT
   ========================================================= */

/*
    Android TV 리모컨의 "1" 버튼을
    PC의 좌클릭과 동일한 입력으로 취급한다.

    1 버튼을 누르고 있는 동안 mouseLeft === true.
    1 버튼을 떼면 mouseLeft === false.
    게임오버에서 1 버튼을 누르면 좌클릭과 동일하게 재시작한다.
*/
let remoteOnePressed = false;

window.addEventListener(
    "keydown",
    function(e) {

        if (
            e.code === "Digit1"
            || e.code === "Numpad1"
            || e.key === "1"
        ) {

            e.preventDefault();

            if (!remoteOnePressed) {
                remoteOnePressed = true;
                mouseLeft = true;

                if (gameOver) {
                    remoteOnePressed = false;
                    mouseLeft = false;
                    reset();
                }
            }
        }
    }
);

window.addEventListener(
    "keyup",
    function(e) {

        if (
            e.code === "Digit1"
            || e.code === "Numpad1"
            || e.key === "1"
        ) {

            e.preventDefault();

            remoteOnePressed = false;
            mouseLeft = false;
        }
    }
);


/* =========================================================
   VECTOR
   ========================================================= */


function dot(
    ax,
    ay,
    bx,
    by
) {

    return (
        ax * bx
        +
        ay * by
    );
}


/* =========================================================
   GAME STATE
   ========================================================= */

let score = 0;

let combo = 0;

let bestCombo = 0;

let lastLandingScore = 0;

let lastImpactSpeed = 0;

let difficultyGauge = 0;

let gameOver = false;

/*
    마지막으로 점수를 획득한 블럭의 다음 인덱스.

    블럭 하나의 끝을 넘어갈 때마다
    1점씩 얻는다.
*/
let nextScoreBlockIndex = 0;


/*
    콤보에 따라 지면 가속도가 증가한다.
*/

function getGroundAcceleration() {

    return Math.min(
        RIGHT_ACCELERATION
        +
        combo * COMBO_ACCELERATION_BONUS,

        30
    );
}


/* =========================================================
   LANDING HANDLER
   ========================================================= */

function handleLanding(impactSpeed, jumpHeight) {

    lastImpactSpeed = impactSpeed;


    /*
        너무 강하게 박으면
        즉시 게임 종료
    */

    if (
        impactSpeed
        >= HARD_LANDING_THRESHOLD * (1 + 0.9 * difficultyGauge / DIFFICULTY_MAX)
    ) {

        gameOver = true;

        lastLandingScore = 0;

        player.y = terrainHeight(player.x) + player.radius;
        player.vy = 0;

        return false;
    }


    /*
        소프트 랜딩
    */

    if (
        impactSpeed
        <= SOFT_LANDING_THRESHOLD * (1 + 1.1 * difficultyGauge / DIFFICULTY_MAX)
    ) {

        const quality =
            Math.max(
                0,
                Math.min(
                    1,
                    1
                    -
                    impactSpeed
                    /
                    SOFT_LANDING_THRESHOLD
                )
            );


        /*
            현재 난이도에서 요구하는
            절대 y 좌표
        */

        const requiredY =
            getRequiredComboY();


        /*
            실제 이번 점프의 최고 y가
            요구 y에 도달했는지 검사한다.

            hard landing이 아니더라도
            이 높이에 도달하지 못했다면
            콤보는 끊긴다.
        */

        if (
            jumpHeight
            >=
            requiredY
        ) {

            combo += 1;

            bestCombo =
                Math.max(
                    bestCombo,
                    combo
                );

            lastLandingScore =
                combo;

            score +=
                combo * combo;

            triggerComboEffect();

        } else {

            combo = 0;
            comboPulse = 0;
            lastLandingScore = 0;
        }


        /*
            난이도 게이지는 기존과 같은 방식으로
            소프트 랜딩 품질 + 현재 콤보를 기준으로 증가한다.
        */

        difficultyGauge +=
            DIFFICULTY_SOFT_LANDING_GAIN
            *
            quality
            +
            DIFFICULTY_COMBO_GAIN
            *
            combo;


        difficultyGauge =
            Math.min(
                DIFFICULTY_MAX,
                difficultyGauge
            );


        return true;
    }


    /*
        일반 착지

        죽지는 않지만 콤보가 끊기고
        난이도 게이지가 절반으로 감소한다.
    */

    combo = 0;
    comboPulse = 0;

    lastLandingScore = 0;

    difficultyGauge *= 0.5;

    return true;
}


/* =========================================================
   COMBO GRAPHICS
   ========================================================= */

function triggerComboEffect() {

    const color =
        getComboColor(combo);


    // 콤보가 유지되는 동안 색상/오라를 계속 표시한다.
    comboPulse = comboPulseMax;


    /*
        콤보 횟수 표시.

        공의 오른쪽 위에서 시작해서
        오른쪽 위 대각선 방향으로 이동하며 사라진다.
    */

    comboPopup = {

        x: player.x + 0.34,

        y: player.y + 0.24,

        vx: 0.65,

        vy: 0.85,

        life: 0.90,

        maxLife: 0.90,

        text: `×${combo}`,

        color: color
    };
}


function triggerAirtimeBonusEffect(gained) {

    airtimeBonusPopup = {
        x: player.x + 0.30,
        y: player.y + 0.30,
        vx: 0.45,
        vy: 0.75,
        life: 0.70,
        maxLife: 0.70,
        text: `+${gained}`,
        color: getComboColor(Math.max(1, combo))
    };
}

function updateComboEffects(dt) {

    // comboPulse는 콤보가 깨질 때까지 유지된다.
    // 따라서 성공 직후뿐 아니라 콤보 유지 중에도 색상 효과가 계속 보인다.


    if (comboPopup) {

        comboPopup.x +=
            comboPopup.vx * dt;

        comboPopup.y +=
            comboPopup.vy * dt;

        comboPopup.vx *=
            Math.exp(-4 * dt);

        comboPopup.vy *=
            Math.exp(-2 * dt);

        comboPopup.life -= dt;


        if (comboPopup.life <= 0) {
            comboPopup = null;
        }
    }
}


/* =========================================================
   BLOCK SCORE
   ========================================================= */

function checkPassedBlocks() {

    /*
        현재 위치까지 필요한 블럭을 생성
    */

    ensureTerrainTo(
        player.x
    );


    /*
        블럭의 끝을 넘어갈 때마다 1점.

        큰 timestep 등으로 여러 블럭을 한 번에
        넘는 경우에도 빠진 점수 없이 모두 처리한다.
    */

    while (
        nextScoreBlockIndex
        < terrainBlocks.length
        &&
        player.x
        >=
        terrainBlocks[
            nextScoreBlockIndex
        ].end
    ) {

        score += Math.max(1, combo);

        nextScoreBlockIndex += 1;
    }
}


/* =========================================================
   PHYSICS STEP
   ========================================================= */

function physicsStep(dt) {

    if (gameOver) {
        return;
    }


    const wasGrounded =
        player.grounded;


    /*
        중력
    */

    player.vy -=
        GRAVITY * dt;


    /*
        좌클릭 외력
    */

    if (mouseLeft) {

        if (player.grounded) {

            /*
                지면:
                오른쪽 가속
            */

            player.vx +=
                getGroundAcceleration() * dt;

        } else {

            /*
                공중:
                아래쪽 가속
            */

            player.vy -=
                DOWN_ACCELERATION * dt;
        }
    }


    /*
        위치
    */

    player.x +=
        player.vx * dt;

    player.y +=
        player.vy * dt;


    /*
        공중에 있는 동안 이번 점프의
        최고 높이를 기록한다.
    */

    if (!player.grounded) {

        currentJumpAirTime += dt;

        player.maxJumpHeight =
            Math.max(
                player.maxJumpHeight,
                player.y
            );

        if (player.vy > 0) {

            let newBonus = 0;

            for (const tier of AIRTIME_BONUS_THRESHOLDS) {
                if (currentJumpAirTime >= tier.time) {
                    newBonus = tier.score;
                }
            }

            if (newBonus > airtimeBonusScore) {

                const gained =
                    newBonus - airtimeBonusScore;

                airtimeBonusScore = newBonus;
                const weightedGained = gained * Math.max(1, combo);
                score += weightedGained;

                triggerAirtimeBonusEffect(weightedGained);
            }
        }
    }


    /*
        블럭 통과 점수
    */

    checkPassedBlocks();


    /*
        현재 지형
    */

    const ground =
        terrainHeight(
            player.x
        );


    const slope =
        terrainSlope(
            player.x
        );


    /*
        접선 벡터
    */

    const tangentLength =
        Math.sqrt(
            1 + slope * slope
        );


    const tx =
        1 / tangentLength;


    const ty =
        slope / tangentLength;


    /*
        법선 벡터
    */

    const nx =
        -slope / tangentLength;


    const ny =
        1 / tangentLength;


    /*
        공의 바닥과 지형의 관계
    */

    const bottom =
        player.y
        -
        player.radius;


    const penetration =
        ground
        -
        bottom;


    /*
        법선 속도
    */

    const normalVelocity =
        dot(
            player.vx,
            player.vy,
            nx,
            ny
        );


    /*
        공 바닥과 지면 사이의 거리.
    */

    const separation =
        bottom - ground;


    /*
        실제 이탈 판정.

        작은 지면 진동은 무시하고,
        공의 바닥이 지면에서 충분히 떨어졌을 때만
        실제 점프를 시작한다.

        한번 실제 점프가 시작되면
        jumpActive가 착지할 때까지 유지된다.
        따라서 지면 근처의 작은 수치 오차 때문에
        다시 grounded 상태로 돌아가지 않는다.
    */

    const actualTakeoff =
        player.grounded
        &&
        !player.jumpActive
        &&
        separation > GROUND_CONTACT_EPSILON;


    if (actualTakeoff) {

        player.grounded = false;

        player.jumpActive = true;

        player.jumpBaseY = ground;

        player.maxJumpHeight =
            player.y;

        currentJumpAirTime = 0;
        airtimeBonusScore = 0;
        airtimeBonusPopup = null;
    }


    /*
        ---------------------------------------
        충돌 / 착지 처리
        ---------------------------------------
    */

    if (penetration > 0) {

        /*
            지형을 향해 들어오는 경우만
            실제 충돌로 처리한다.
        */

        if (normalVelocity < 0) {

            /*
                jumpActive가 true라면
                이것은 실제 점프의 착지다.
            */

            if (player.jumpActive) {

                const impactSpeed =
                    -normalVelocity;

                const jumpHeight =
                    player.maxJumpHeight;

                const landingSucceeded =
                    handleLanding(
                        impactSpeed,
                        jumpHeight
                    );

                if (!landingSucceeded) {

                    player.vx = 0;
                    player.vy = 0;

                    return;
                }

                /*
                    착지를 끝냈으므로
                    다음 실제 이탈까지 점프 상태 종료.
                */

                player.jumpActive = false;
            }


            /*
                접선 속도
            */

            const tangentVelocity =
                dot(
                    player.vx,
                    player.vy,
                    tx,
                    ty
                );


            /*
                충돌 후 법선 속도
            */

            const newNormalVelocity =
                -normalVelocity
                *
                RESTITUTION;


            /*
                속도 재구성
            */

            player.vx =
                tangentVelocity * tx
                +
                newNormalVelocity * nx;


            player.vy =
                tangentVelocity * ty
                +
                newNormalVelocity * ny;


            /*
                표면 위로 보정
            */

            player.y =
                ground
                +
                player.radius;


            player.grounded = true;

            player.maxJumpHeight =
                player.y;

        } else {

            /*
                jumpActive 중에는 절대로
                작은 간격을 이유로 grounded=true로
                되돌리지 않는다.
            */

            if (player.jumpActive) {

                player.grounded = false;

            } else if (
                separation <= GROUND_CONTACT_EPSILON
            ) {

                player.y =
                    ground
                    +
                    player.radius;

                player.grounded = true;

            } else {

                player.grounded = false;
            }
        }

    } else {

        /*
            공중 점프가 이미 시작됐다면
            착지할 때까지 계속 공중 상태다.
        */

        if (player.jumpActive) {

            player.grounded = false;

        } else if (
            separation <= GROUND_CONTACT_EPSILON
        ) {

            player.grounded = true;

        } else {

            player.grounded = false;
        }
    }


    /*
        실제 점프 중일 때만 최고 높이를 기록한다.
    */

    if (player.jumpActive) {

        player.maxJumpHeight =
            Math.max(
                player.maxJumpHeight,
                player.y
            );
    }


    /*
        너무 아래로 떨어지면 리셋
    */

    if (player.y < -10) {

        reset();
    }
}


/* =========================================================
   CAMERA
   ========================================================= */

const camera = {

    /*
        카메라 중심의 월드 X

        X와 zoom은 완전히 독립
    */

    centerX: 3,

    zoom: 95
};


/*
    화면 최하단
        y = -2
*/

const CAMERA_BOTTOM_Y = -2;


/*
    줌
*/

const MAX_ZOOM = 95;

const MIN_ZOOM = 50;

/* Responsive camera scaling: 1600x900 is the original reference view. */
const CAMERA_REFERENCE_WIDTH = 1600;
const CAMERA_REFERENCE_HEIGHT = 900;

function getViewportScale() {
    /*
        가로 방향으로 긴 화면에서도 세로에 끌려가서
        과도하게 줌아웃되지 않도록 가로 크기를 기준으로 한다.
    */
    return W / CAMERA_REFERENCE_WIDTH;
}

function getResponsiveMaxZoom() {
    return MAX_ZOOM * getViewportScale();
}

function getResponsiveMinZoom() {
    return MIN_ZOOM * getViewportScale();
}



/*
    좌우 카메라

    공보다 얼마나 앞을 바라볼지
*/

const CAMERA_LOOK_AHEAD = 3.0;


/*
    카메라 X 추적 속도
*/

const CAMERA_X_SPEED = 20;


/*
    공이 화면에서 너무 오른쪽으로 가면
    강제로 카메라를 더 빨리 따라가게 한다.
*/

const CAMERA_RIGHT_LIMIT = 0.72;


/*
    상승할 때의 줌아웃 정도
*/

const ZOOM_HEIGHT_FACTOR_UP = 11;

/*
    하강할 때의 줌아웃 정도
*/

const ZOOM_HEIGHT_FACTOR_DOWN = 20;


/*
    줌 변화 속도
*/

const ZOOM_SPEED = 3.0;

// 높이가 높아질수록 시간이 선형적으로 느려진다.
// 높이 0에서는 1.0배, 기준 높이 이상에서는 0.8배.
const TIME_SLOW_HEIGHT = 2.0;
const MIN_TIME_SCALE = 0.8;

function getTimeScale() {

    const height =
        Math.max(
            0,
            player.y - player.jumpBaseY - player.radius
        );

    const ratio =
        Math.min(
            1,
            height / TIME_SLOW_HEIGHT
        );

    return 1 - (1 - MIN_TIME_SCALE) * ratio;
}


/* =========================================================
   CAMERA UPDATE
   ========================================================= */

function updateCamera(dt) {

    /* =====================================================
       ZOOM
       ===================================================== */

    let targetZoom;

    const ZOOM_HEIGHT_FACTOR = (!player.grounded && player.vy > 0)
        ? ZOOM_HEIGHT_FACTOR_UP
        : ZOOM_HEIGHT_FACTOR_DOWN;

    const height =
        Math.max(
            0,
            player.y
            -
            player.jumpBaseY
            -
            player.radius
        );


    targetZoom =
        getResponsiveMaxZoom()
        -
        height
        *
        ZOOM_HEIGHT_FACTOR
        *
        getViewportScale();


    /*
        줌 제한
    */

    targetZoom =
        Math.max(
            getResponsiveMinZoom(),
            Math.min(
                getResponsiveMaxZoom(),
                targetZoom
            )
        );


    /*
        줌을 부드럽게 변경
    */

    const zoomSmooth =
        1 -
        Math.exp(
            -ZOOM_SPEED * dt
        );


    camera.zoom +=
        (
            targetZoom
            -
            camera.zoom
        )
        *
        zoomSmooth;


    /* =====================================================
       CAMERA X
       ===================================================== */

    /*
        공보다 앞을 바라보는 목표 위치

        zoom은 여기서 사용하지 않는다.
    */

    let targetCenterX =
        player.x
        +
        CAMERA_LOOK_AHEAD;


    /*
        현재 공의 화면 위치
    */

    const playerScreenX =
        screenX(
            player.x
        );


    /*
        공이 너무 오른쪽으로 가면
        카메라가 더 적극적으로 따라간다.
    */

    if (
        playerScreenX
        >
        W * CAMERA_RIGHT_LIMIT
    ) {

        const safetyCenterX =
            player.x
            -
            (
                W * 0.50
            )
            /
            camera.zoom;


        targetCenterX =
            Math.max(
                targetCenterX,
                safetyCenterX
            );
    }


    /*
        카메라는 절대로 왼쪽으로 움직이지 않는다.
    */

    targetCenterX =
        Math.max(
            targetCenterX,
            camera.centerX
        );


    /*
        부드러운 X 이동
    */

    const xSmooth =
        1 -
        Math.exp(
            -CAMERA_X_SPEED * dt
        );


    camera.centerX +=
        (
            targetCenterX
            -
            camera.centerX
        )
        *
        xSmooth;


    /*
        비상 안전장치

        공이 화면 오른쪽 82%를 넘어가면
        빠르게 추적한다.
    */

    const newPlayerScreenX =
        screenX(
            player.x
        );


    if (
        newPlayerScreenX
        >
        W * 0.82
    ) {

        const emergencyCenterX =
            player.x
            -
            (
                W * 0.45
            )
            /
            camera.zoom;


        if (
            emergencyCenterX
            >
            camera.centerX
        ) {

            camera.centerX +=
                (
                    emergencyCenterX
                    -
                    camera.centerX
                )
                *
                Math.min(
                    1,
                    20 * dt
                );
        }
    }
}


/* =========================================================
   WORLD → SCREEN
   ========================================================= */

function screenX(x) {

    return (
        (
            x
            -
            camera.centerX
        )
        *
        camera.zoom
        +
        W * 0.5
    );
}


/*
    화면 최하단 = y = -2
*/

function screenY(y) {

    return (
        H
        -
        (
            y
            -
            CAMERA_BOTTOM_Y
        )
        *
        camera.zoom
    );
}


/* =========================================================
   BACKGROUND
   ========================================================= */

function drawBackground() {

    ctx.fillStyle =
        "#101820";


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle =
        "rgba(255,255,255,0.08)";


    const spacing = 80;


    for (
        let x = 0;
        x < W;
        x += spacing
    ) {

        for (
            let y = 0;
            y < H * 0.5;
            y += spacing
        ) {

            ctx.beginPath();


            ctx.arc(
                x + ((y * 13) % 40),
                y + ((x * 7) % 30),
                1,
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    }
}


/* =========================================================
   TERRAIN DRAW
   ========================================================= */

function drawTerrain() {

    const visibleHalfWidth =
        W
        /
        (
            2
            *
            camera.zoom
        );


    const leftWorld =
        camera.centerX
        -
        visibleHalfWidth
        -
        2;


    const rightWorld =
        camera.centerX
        +
        visibleHalfWidth
        +
        2;


    ensureTerrainTo(
        rightWorld
    );


    const step = 0.035;


    /*
        지형 채우기
    */

    ctx.beginPath();


    let x =
        leftWorld;


    let y =
        terrainHeight(x);


    ctx.moveTo(
        screenX(x),
        screenY(y)
    );


    for (
        x = leftWorld + step;
        x <= rightWorld;
        x += step
    ) {

        y =
            terrainHeight(x);


        ctx.lineTo(
            screenX(x),
            screenY(y)
        );
    }


    /*
        화면 아래까지 닫기
    */

    ctx.lineTo(
        screenX(rightWorld),
        H + 100
    );


    ctx.lineTo(
        screenX(leftWorld),
        H + 100
    );


    ctx.closePath();


    ctx.fillStyle =
        "#263238";


    ctx.fill();


    /*
        지형 외곽선
    */

    ctx.beginPath();


    x =
        leftWorld;


    y =
        terrainHeight(x);


    ctx.moveTo(
        screenX(x),
        screenY(y)
    );


    for (
        x = leftWorld + step;
        x <= rightWorld;
        x += step
    ) {

        y =
            terrainHeight(x);


        ctx.lineTo(
            screenX(x),
            screenY(y)
        );
    }


    ctx.strokeStyle =
        "#eeeeee";


    /*
        지형선도 카메라 스케일에 맞춰 축소한다.
        모바일의 작은 화면에서 2px가 상대적으로 너무 두껍게
        보이는 현상을 방지한다.
    */
    ctx.lineWidth =
        Math.max(
            0.8,
            2 * getViewportScale()
        );


    ctx.stroke();
}


/* =========================================================
   PLAYER DRAW
   ========================================================= */

function drawPlayer() {

    const sx =
        screenX(
            player.x
        );


    const sy =
        screenY(
            player.y
        );


    const radius =
        player.radius
        *
        camera.zoom;


    /*
        콤보 성공 직후에는
        콤보 횟수에 따라 다른 색의 오라를
        공 자체에 표시한다.
    */

    if (combo > 0) {

        // 콤보가 깨지기 전까지 오라를 유지한다.
        const progress = 0;

        const comboNumber =
            Math.max(1, combo);

        const auraScale =
            getComboAuraScale(comboNumber);

        const color =
            getComboColor(
                comboNumber,
                1
            );


        /*
            바깥쪽 맥동 링
        */

        const pulseRadius =
            radius
            *
            (
                1.10
                +
                progress * 0.95
            )
            *
            auraScale;


        ctx.save();

        ctx.globalAlpha =
            0.62 * (1 - progress);

        ctx.strokeStyle = color;

        ctx.lineWidth =
            2.5
            +
            Math.min(
                comboNumber,
                10
            ) * 0.20;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            pulseRadius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();


        /*
            공 주변의 색상 오라
        */

        const glowRadius =
            radius
            *
            (
                2.0
                +
                auraScale * 0.45
            );


        const gradient =
            ctx.createRadialGradient(
                sx,
                sy,
                radius * 0.20,
                sx,
                sy,
                glowRadius
            );


        gradient.addColorStop(
            0,
            getComboColor(
                comboNumber,
                0.62
            )
        );

        gradient.addColorStop(
            0.35,
            getComboColor(
                comboNumber,
                0.25
            )
        );

        gradient.addColorStop(
            1,
            getComboColor(
                comboNumber,
                0
            )
        );


        ctx.save();

        ctx.globalAlpha =
            1 - progress;

        ctx.fillStyle = gradient;

        ctx.beginPath();

        ctx.arc(
            sx,
            sy,
            glowRadius,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.restore();
    }


    /*
        그림자
    */

    ctx.beginPath();

    ctx.arc(
        sx + radius * 0.12,
        sy + radius * 0.15,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "rgba(0,0,0,0.3)";

    ctx.fill();


    /*
        공

        콤보 성공 순간에는
        콤보 색상으로 잠깐 변한다.
    */

    ctx.beginPath();

    ctx.arc(
        sx,
        sy,
        radius,
        0,
        Math.PI * 2
    );


    if (combo > 0) {

        // 콤보가 유지되는 동안 항상 현재 콤보 색상을 유지한다.
        ctx.fillStyle =
            getComboColor(
                combo,
                0.72
            );

    } else {

        ctx.fillStyle =
            "#ffffff";
    }

    ctx.fill();


    ctx.strokeStyle =
        "#111111";

    ctx.lineWidth = 2;

    ctx.stroke();


    /*
        콤보 횟수 표시

        공의 오른쪽 위에서 시작해서
        오른쪽 위 대각선으로 이동하며 사라진다.
    */

    if (airtimeBonusPopup) {

        const alpha =
            Math.max(
                0,
                airtimeBonusPopup.life /
                airtimeBonusPopup.maxLife
            );

        const bonusX =
            screenX(airtimeBonusPopup.x);

        const bonusY =
            screenY(airtimeBonusPopup.y);

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.translate(bonusX, bonusY);
        ctx.rotate(-Math.PI / 12);

        ctx.fillStyle =
            airtimeBonusPopup.color;

        ctx.font = "bold 20px Arial";
        ctx.textAlign = "left";
        ctx.textBaseline = "middle";

        ctx.shadowColor =
            "rgba(0,0,0,0.55)";
        ctx.shadowBlur = 4;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 2;

        ctx.fillText(
            airtimeBonusPopup.text,
            0,
            0
        );

        ctx.restore();
    }

    if (comboPopup) {

        const alpha =
            Math.max(
                0,
                comboPopup.life
                /
                comboPopup.maxLife
            );

        const popupX =
            screenX(comboPopup.x);

        const popupY =
            screenY(comboPopup.y);


        ctx.save();

        ctx.globalAlpha = alpha;

        ctx.translate(
            popupX,
            popupY
        );

        ctx.rotate(-Math.PI / 12);

        ctx.fillStyle =
            comboPopup.color;

        ctx.font =
            "bold 22px Arial";

        ctx.textAlign =
            "left";

        ctx.textBaseline =
            "middle";

        ctx.shadowColor =
            "rgba(0,0,0,0.55)";

        ctx.shadowBlur = 4;

        ctx.shadowOffsetX = 1;

        ctx.shadowOffsetY = 2;

        ctx.fillText(
            comboPopup.text,
            0,
            0
        );

        ctx.restore();
    }
}


/* =========================================================
   LANDING THRESHOLD GUIDE
   ========================================================= */

/* =========================================================
   LANDING THRESHOLD GUIDE
   ========================================================= */

/*
    요구 착지 높이를 나타내는 실선.
    높이 변화는 landingGuideY가 부드럽게 따라간다.
*/

function drawGuideLine(worldY) {

    const sy =
        screenY(worldY);


    if (
        sy < -40
        ||
        sy > H + 40
    ) {
        return;
    }


    ctx.save();

    ctx.beginPath();

    ctx.moveTo(
        0,
        sy
    );

    ctx.lineTo(
        W,
        sy
    );

    ctx.strokeStyle =
        "rgba(255,255,255,0.70)";

    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.restore();
}


function updateLandingGuide(dt) {

    const targetY =
        getRequiredComboY();

    const smooth =
        1 - Math.exp(-8.0 * dt);

    landingGuideY +=
        (targetY - landingGuideY)
        *
        smooth;
}


function drawLandingThreshold() {

    if (gameOver) {
        return;
    }


    drawGuideLine(
        landingGuideY
    );
}


/* =========================================================
   HUD
   ========================================================= */

function drawHUD() {

    ctx.fillStyle =
        "rgba(255,255,255,0.9)";

    ctx.textAlign = "left";

    ctx.font =
        "bold 18px Arial";

    ctx.fillText(
        `점수: ${score}`,
        16,
        30
    );

    /*
        게임 오버
    */

    if (gameOver) {

        ctx.textAlign = "center";

        ctx.fillStyle =
            "rgba(0,0,0,0.55)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.font =
            "bold 42px Arial";

        ctx.fillText(
            "GAME OVER",
            W / 2,
            H / 2 - 24
        );

        ctx.font =
            "20px Arial";

        ctx.fillText(
            `점수 ${score}`,
            W / 2,
            H / 2 + 18
        );
    }

    ctx.textAlign = "left";
}


/* =========================================================
   RENDER
   ========================================================= */

function render() {

    drawBackground();

    drawTerrain();

    drawLandingThreshold();

    drawPlayer();

    drawHUD();
}


/* =========================================================
   RESET
   ========================================================= */

function reset() {

    /*
        게임 상태 초기화
    */

    score = 0;

    combo = 0;

    bestCombo = 0;

    lastLandingScore = 0;

    lastImpactSpeed = 0;

    difficultyGauge = 0;

    gameOver = false;

    nextScoreBlockIndex = 0;

    comboPulse = 0;
    comboPopup = null;
    currentJumpAirTime = 0;
    airtimeBonusScore = 0;
    airtimeBonusPopup = null;


    /*
        기존 랜덤 지형 삭제
    */

    terrainBlocks = [];


    /*
        ---------------------------------------
        첫 번째 블럭은 무조건 START
        ---------------------------------------
    */

    const startType =
        TERRAIN_TYPES[0];


    terrainBlocks.push({

        type: 0,

        name: startType.name,

        scale: 1.0,

        start: 0,

        end: startType.width
    });


    /*
        ---------------------------------------
        이후부터 랜덤
        ---------------------------------------
    */

    /*
        첫 번째 랜덤 블럭을 하나 바로 생성
        이후에는 ensureTerrainTo()가 자동 생성
    */

    generateNextTerrainBlock();


    /*
        ---------------------------------------
        플레이어
        ---------------------------------------
    */

    player.x = 0;


    player.y =
        terrainHeight(0)
        +
        player.radius
        +
        0.001;


    player.vx = 0;

    player.vy = 0;


    player.grounded = true;

    player.jumpActive = false;


    player.jumpBaseY =
        terrainHeight(0);

    player.jumpBaseX =
        player.x;

    player.maxJumpHeight =
        player.y;

    player.jumpActive = false;


    landingGuideY =
        getRequiredComboY();



    /*
        ---------------------------------------
        카메라
        ---------------------------------------
    */

    camera.zoom =
        MAX_ZOOM;


    camera.centerX =
        player.x
        +
        CAMERA_LOOK_AHEAD;
}


/* =========================================================
   GAME LOOP
   ========================================================= */

let previousTime =
    performance.now();


function loop(time) {

    let dt =
        (
            time
            -
            previousTime
        )
        /
        1000;


    previousTime =
        time;


    /*
        긴 프레임 방지
    */

    dt =
        Math.min(
            dt,
            0.05
        );


    /*
        ---------------------------------------
        PHYSICS
        ---------------------------------------
    */

    const timeScale = getTimeScale();
    const gameDt = dt * timeScale;

    const FIXED_STEP =
        1 / 120;

    let remaining =
        gameDt;


    while (remaining > 0) {

        const step =
            Math.min(
                FIXED_STEP,
                remaining
            );


        physicsStep(step);


        remaining -= step;
    }


    /*
        ---------------------------------------
        CAMERA
        ---------------------------------------
    */

    updateCamera(gameDt);


    /*
        ---------------------------------------
        LANDING GUIDE
        ---------------------------------------
    */

    updateLandingGuide(gameDt);


    /*
        ---------------------------------------
        COMBO EFFECTS
        ---------------------------------------
    */

    updateComboEffects(gameDt);


    /*
        ---------------------------------------
        RENDER
        ---------------------------------------
    */

    render();


    requestAnimationFrame(loop);
}


/* =========================================================
   START
   ========================================================= */

reset();

requestAnimationFrame(loop);

</script>
